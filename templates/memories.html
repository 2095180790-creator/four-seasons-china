<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171814">
  <meta name="description" content="Save your own travel photographs and activities in this browser.">
  <title>My Travel Memories | Four Seasons Across China</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23171814%22/><path d=%22M50 16c11 11 16 21 16 34S61 84 50 84 34 63 34 50s5-23 16-34Z%22 fill=%22%23f4efe7%22/></svg>">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body class="memories-page">
  <header class="site-header" data-reveal>
    <a class="wordmark" href="/" aria-label="Four Seasons Across China home">
      <span class="wordmark-mark" aria-hidden="true"></span>
      <span>Four Seasons<br>Across China</span>
    </a>
    <nav class="mini-nav" aria-label="Seasons">
      {{MINI_NAV}}
    </nav>
  </header>

  <main class="memories-main">
    <p class="eyebrow" data-reveal>Personal travel log</p>
    <h1 data-reveal>My Travel Memories</h1>
    <p class="memories-intro" data-reveal>
      Add a photograph, the place you visited, and something you did there.
      Everything stays in this browser and is never uploaded to a server.
    </p>

    <form class="memory-form" id="memory-form" data-reveal novalidate>
      <label class="memory-field">
        <span>Photo</span>
        <input type="file" id="memory-image" accept="image/*" required>
      </label>
      <label class="memory-field">
        <span>Place</span>
        <input type="text" id="memory-place" maxlength="60" placeholder="e.g. Sanya, Hainan" required>
      </label>
      <label class="memory-field memory-field-wide">
        <span>What you did there</span>
        <input type="text" id="memory-activity" maxlength="120" placeholder="e.g. Snorkelling at sunrise" required>
      </label>
      <button class="memory-submit" type="submit">Add memory</button>
    </form>

    <p class="memory-status" id="memory-status" role="status"></p>

    <section class="memory-grid" id="memory-grid" aria-live="polite"></section>
  </main>

  <footer class="home-footer" data-reveal>
    <span>Web Technologies Project · 2026</span>
    <span><a href="/">Back to the four seasons</a></span>
  </footer>

  <script src="/static/js/memories.js" defer></script>
</body>
</html>
