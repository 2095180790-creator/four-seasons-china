<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6e6eb">
  <meta name="description" content="The earth laughs in flowers. Explore Spring in Kunming, Yunnan.">
  <title>Spring in Kunming | Four Seasons Across China</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23171814%22/><path d=%22M50 16c11 11 16 21 16 34S61 84 50 84 34 63 34 50s5-23 16-34Z%22 fill=%22%23f4efe7%22/></svg>">
  <link rel="stylesheet" href="../static/css/style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body class="season-page season-page--spring">
  <main
    class="season-view"
    style="--accent: #d76e8d; --wash: #f6e6eb;"
    data-previous-url="../winter/"
    data-next-url="../summer/"
    data-home-url="../"
  >
    <header class="season-header" data-reveal>
      <a class="back-link" href="../" data-page-transition>
        <span aria-hidden="true">←</span> All seasons
      </a>
      <p class="season-location">Kunming, Yunnan</p>
    </header>

    <section class="season-layout" aria-labelledby="season-title">
      <figure class="season-visual" data-reveal>
        <img src="../static/images/spring-kunming.jpg" alt="Pink cherry blossoms framing a traditional building in Kunming" fetchpriority="high">
        <figcaption>Kunming, Yunnan · Spring</figcaption>
      </figure>

      <article class="season-copy">
        <div class="season-index" data-reveal>
          <span>01</span>
          <span>/ 04</span>
        </div>

        <p class="eyebrow season-kicker" data-reveal>Spring in Kunming</p>
        <h1 id="season-title" class="sr-only">Spring in Kunming, Yunnan</h1>

        <blockquote data-reveal>
          <p>“The earth laughs in flowers.”</p>
          <footer>— Ralph Waldo Emerson</footer>
        </blockquote>

        <nav class="season-pagination" aria-label="Previous and next seasons" data-reveal>
          <a href="../winter/" data-page-transition>
            <span class="pagination-label">Previous</span>
            <span class="pagination-name">← Winter</span>
          </a>
          <a href="../summer/" data-page-transition>
            <span class="pagination-label">Next</span>
            <span class="pagination-name">Summer →</span>
          </a>
        </nav>
      </article>
    </section>

    <div class="season-swipe-hint" aria-hidden="true">
      <span>Swipe to change seasons</span>
      <span class="swipe-line"></span>
    </div>
  </main>

  <script src="../static/js/main.js" defer></script>
</body>
</html>
